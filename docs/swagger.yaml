host: localhost:8080
info:
  contact: {}
  description: REST API middleware for multi-hospital deployments managing hospitals,
    staff, and patients.
  title: Hospital Middleware System API
  version: "1.0"
paths:
  /health:
    get:
      description: 'Returns service name and 200 OK when the process is alive. Note:
        it does not verify DB connectivity.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/hospital-middleware-system_src_helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/src_router.HealthResponse'
              type: object
      summary: Liveness / readiness health check
      tags:
      - System
  /hospitals:
    get:
      description: Return a paginated list of all hospitals sorted by most recent
        first.
      parameters:
      - default: 1
        description: Page number (1-indexed)
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 10
        description: Items returned per page (1..100)
        in: query
        maximum: 100
        minimum: 1
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/hospital-middleware-system_src_helper.Response'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/hospital-middleware-system_src_helper.PaginatedResponse'
                  - properties:
                      items:
                        items:
                          $ref: '#/definitions/hospital-middleware-system_src_modules_hospitals_serializer.ListHospitalItem'
                        type: array
                    type: object
              type: object
      summary: List hospitals
      tags:
      - Hospitals
  /patients:
    get:
      description: Return a paginated list of patients scoped to the caller's hospital
        (from JWT claims). Supports optional filtering by identifiers, name components,
        date of birth, email, and phone number.
      parameters:
      - description: Exact match on national ID / citizen ID number
        in: query
        name: national_id
        type: string
      - description: Exact match on passport number
        in: query
        name: passport_id
        type: string
      - description: Case-insensitive partial match on first name (English or Thai)
        in: query
        name: first_name
        type: string
      - description: Case-insensitive partial match on middle name (English or Thai)
        in: query
        name: middle_name
        type: string
      - description: Case-insensitive partial match on last name (English or Thai)
        in: query
        name: last_name
        type: string
      - description: Exact match on date of birth in YYYY-MM-DD format
        in: query
        name: date_of_birth
        type: string
      - description: Case-insensitive partial match on email address
        in: query
        name: email
        type: string
      - description: Case-insensitive partial match on phone number
        in: query
        name: phone_number
        type: string
      - default: 1
        description: Page number (1-indexed)
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 10
        description: Items per page (1..100)
        in: query
        maximum: 100
        minimum: 1
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/hospital-middleware-system_src_helper.Response'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/hospital-middleware-system_src_helper.PaginatedResponse'
                  - properties:
                      items:
                        items:
                          $ref: '#/definitions/hospital-middleware-system_src_modules_patients_serializer.ListPatientItem'
                        type: array
                    type: object
              type: object
      security:
      - BearerAuth: []
      summary: List patients
      tags:
      - Patients
  /patients/{id}:
    get:
      description: 'Retrieve a single patient using any identifier: integer patient
        ID, national ID, or passport number. Results are automatically scoped to the
        caller''s hospital from JWT claims.'
      parameters:
      - description: 'Patient identifier: numeric ID, national_id, or passport_id'
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/hospital-middleware-system_src_helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/hospital-middleware-system_src_modules_patients_serializer.GetPatientResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Get a patient by identifier
      tags:
      - Patients
  /staffs:
    post:
      consumes:
      - application/json
      description: Create a staff user bound to a hospital.
      parameters:
      - description: Staff details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/hospital-middleware-system_src_modules_staffs_dto.CreateStaffRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/hospital-middleware-system_src_helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/hospital-middleware-system_src_modules_staffs_serializer.CreateStaffResponse'
              type: object
      summary: Create a new staff account
      tags:
      - Staff
  /staffs/login:
    post:
      consumes:
      - application/json
      description: Verify staff email + password (bcrypt compare) and return a short-lived
        Bearer JWT plus staff profile.
      parameters:
      - description: Staff credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/hospital-middleware-system_src_modules_staffs_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/hospital-middleware-system_src_helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/hospital-middleware-system_src_modules_staffs_serializer.LoginResponse'
              type: object
      summary: Authenticate staff and issue JWT
      tags:
      - Auth
  /staffs/me:
    get:
      description: Return the staff profile of the caller, resolved from the staff_id
        JWT claim.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/hospital-middleware-system_src_helper.Response'
            - properties:
                data:
                  $ref: '#/definitions/hospital-middleware-system_src_modules_staffs_serializer.StaffMeResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Get the current authenticated staff profile
      tags:
      - Staff
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: 'JWT Bearer token. Format: "Bearer <token>"'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
